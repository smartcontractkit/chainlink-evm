# Builds external repositories that use this so we can create tickets to update them before their ci pipelines break.
# NOTE: This is not a required check to merge, merely a check so you know to update the products that rely on this.
name: Build External Repositories
on:
  pull_request:

# Only run 1 of this workflow at a time per PR
concurrency:
  group: integration-build-check-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  init:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core-ref: ${{ steps.set-git-refs.outputs.core-ref }}
    steps:
      # Checkout the shared scripts from the smartcontractkit/.github repo.
      - name: Checkout shared .github scripts
        uses: actions/checkout@v4
        with:
          repository: smartcontractkit/.github
          # TODO: pin to a commit SHA once the get-refs-from-pr-body.js PR is merged into smartcontractkit/.github.
          ref: feature/get-ref-from-pr-body
          persist-credentials: false
          sparse-checkout: tools/scripts/get-refs-from-pr-body.js
          sparse-checkout-cone-mode: false
          path: dot_github
      - name: Get refs from PR body
        id: set-git-refs
        uses: actions/github-script@v7
        with:
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/dot_github/tools/scripts/get-refs-from-pr-body.js`)
            await script({ github, context, core })

  build-chainlink:
    needs: init
    environment:
      name: integration
      deployment: false
    permissions:
      contents: read
      id-token: write
    name: Build Chainlink
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout the chainlink-evm repo
        uses: actions/checkout@v4
        with:
          repository: smartcontractkit/chainlink-evm
          persist-credentials: false
          path: chainlink-evm

      - name: Checkout the chainlink core repo
        uses: actions/checkout@v4
        with:
          repository: smartcontractkit/chainlink
          ref: ${{ needs.init.outputs.core-ref }}
          persist-credentials: false
          path: chainlink

      - name: Setup Go
        uses: ./chainlink-evm/.github/actions/setup-go
        with:
          go-version-file: "chainlink/go.mod"
          only-modules: "true"

      - name: Build /chainlink
        shell: bash
        env:
          CL_EVM_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: chainlink
        run: |
          go get "github.com/smartcontractkit/chainlink-evm@${CL_EVM_SHA}"
          make gomodtidy
          make install-chainlink
